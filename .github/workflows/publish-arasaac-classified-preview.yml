name: Publish ARASAAC unique-visual preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-arasaac-classified-preview.yml
      - .github/scripts/generate_arasaac_unique_visuals.py

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the generator
        uses: actions/checkout@v4

      - name: Download and verify the existing filtered archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip
          SOURCE_SHA256: 5684591cc3774d8353654dd0619f3232bd9be256d20c4b7c1ee5b56841a0255f
        run: |
          gh release download "arasaac-classified-preview-2026-10-09" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_NAME" \
            --dir .
          echo "$SOURCE_SHA256  $SOURCE_NAME" | sha256sum --check

      - name: Build the unique-visual archive
        env:
          SOURCE_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip
          OUTPUT_NAME: arasaac-unique-visuals-colored-flat-128px-2026-10-10-v3.zip
        run: |
          python3 .github/scripts/generate_arasaac_unique_visuals.py \
            "$SOURCE_NAME" \
            "$OUTPUT_NAME"
          unzip -tq "$OUTPUT_NAME"
          test "$(stat -c %s "$OUTPUT_NAME")" -gt 30000000
          test "$(stat -c %s "$OUTPUT_NAME")" -lt 35000000
          sha256sum "$OUTPUT_NAME" | tee unique-visuals-archive.sha256

      - name: Upload the unique-visual archive
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_NAME: arasaac-unique-visuals-colored-flat-128px-2026-10-10-v3.zip
        run: |
          gh release upload "arasaac-classified-preview-2026-10-09" "$OUTPUT_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Post the corrected result to issue 1
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_NAME: arasaac-unique-visuals-colored-flat-128px-2026-10-10-v3.zip
        run: |
          ARCHIVE_SHA256="$(cut -d ' ' -f 1 unique-visuals-archive.sha256)"
          ARCHIVE_SIZE="$(stat -c %s "$OUTPUT_NAME")"
          ARCHIVE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/arasaac-classified-preview-2026-10-09/$OUTPUT_NAME"

          cat > issue-body.md <<EOF
          已修正上一版“同一画面因英文词条不同而重复出现”的问题，并重新发布 **唯一画面版**：

          下载：[$OUTPUT_NAME]($ARCHIVE_URL)

          - 原词条图片：7,369 张
          - 保留唯一画面：**5,805 张**
          - 删除完全相同的重复图片：**1,564 张**
          - 涉及重复画面的分组：1,233 组
          - 包内 JPG 内容哈希唯一数：5,805，重复剩余：**0**
          - 原 7,369 个中英文词条全部保留；被合并词条记录在 \`ALIASES_同图词条.csv\` 和 \`selection-manifest.json\`
          - 用户指出的 \`sorry/sorry!\`、\`verb/verbs\`、\`congratulations(!)\`、\`very well(!)\`、\`what is that/what's that\`、电子邮件问句重复均已合并

          文件大小：**$ARCHIVE_SIZE 字节**（约 30.4 MiB）
          SHA-256：\`$ARCHIVE_SHA256\`

          这是带标准 UTF-8 文件名标志的普通 ZIP，macOS“归档实用工具”可以直接解压。

          **仓库现在是私有仓库。请先登录有权限的 GitHub 账号再下载。** 未登录时下载到的 9 字节 \`Not Found\` 文件无法解压。

          许可提醒：ARASAAC 原图为 CC BY-NC-SA，本包仅供非商业审核和自制素材规划，不可直接作为 CardChat 商业素材使用。
          EOF

          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file issue-body.md

      - name: Mark the unique-visual upload as complete
        env:
          GH_TOKEN: ${{ github.token }}
          SUCCESS_TAG: arasaac-unique-visuals-upload-success-2026-10-10
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SUCCESS_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$SUCCESS_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$SUCCESS_TAG" \
              -f sha="$GITHUB_SHA"
          fi
