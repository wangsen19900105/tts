name: Publish ARASAAC one-per-term filtered preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-arasaac-classified-preview.yml

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify filtered archive
        env:
          ARCHIVE_URL: https://temp.sh/RVKfx/arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip
          ARCHIVE_SHA256: 5684591cc3774d8353654dd0619f3232bd9be256d20c4b7c1ee5b56841a0255f
          ARCHIVE_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --request POST "$ARCHIVE_URL" --output "$ARCHIVE_NAME"
          echo "$ARCHIVE_SHA256  $ARCHIVE_NAME" | sha256sum --check

      - name: Upload filtered archive to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip
        run: |
          gh release upload "arasaac-classified-preview-2026-10-09" "$ARCHIVE_NAME" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            供手机查看和人工审核的 ARASAAC 分类预览包。

            ## 一词一图、彩色平涂优先版（新增）

            - 从 12,846 张候选中，按 7,369 个区分大小写的英文词条各保留 1 张
            - 淘汰 5,477 张同词候选；不同英文词共用同一画面的情况保留
            - 116 个词条经人工复核后，从默认主图切换为更接近彩色平涂风格的候选
            - 同词有安全替代图时，优先去掉火柴人、通用光头人物和旧线稿
            - 人物肤色色块只用于候选排序，优先浅肤色或浅黄色调，不据此推断人物种族
            - 保留图含 5,805 个不同的图片内容
            - 22 个自动粗分类，目录及图片统一采用“中文@英文原文”命名
            - 附完整选择清单、淘汰清单、人工 override 记录及 SHA-256
            - SHA-256: 5684591cc3774d8353654dd0619f3232bd9be256d20c4b7c1ee5b56841a0255f

            ## 原始全量分类预览版

            - 12,846 张最长边不超过 128px 的 JPEG 预览图
            - 22 个自动粗分类，目录及图片统一采用“中文@英文原文”命名
            - SHA-256: 605585453ae54c832f89dc7686c115af1c28664fd99c58bf98b163f7df658928

            注意：分类和部分中文名由机器辅助生成，正式制作素材前必须人工复核。

            图形作者：Sergio Palao；来源：ARASAAC（https://arasaac.org/）；许可：CC BY-NC-SA。仅限非商业用途并须署名、相同方式共享。此预览包不代表取得 CardChat 或其他商业软件的使用授权。
        run: |
          gh release edit "arasaac-classified-preview-2026-10-09" --repo "$GITHUB_REPOSITORY" --notes "$RELEASE_NOTES"

      - name: Post the filtered result to issue 1
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_BODY: |
            已完成“一词一图、彩色平涂优先”筛选版：

            - 保留 **7,369 张**（每个区分大小写的英文词条 1 张）
            - 淘汰 **5,477 张**同词候选
            - **116 个词条**经人工复核后更换为彩色平涂候选
            - 保留图中有 **5,805 个不同图片内容**；同义词或不同词共用画面的情况没有误删
            - 同词有安全替代图时，优先去掉火柴人、通用光头人物和旧线稿
            - 人物肤色色块优先浅肤色或浅黄色调，不据此推断人物种族
            - 目录与图片名继续使用“中文@英文原文”格式，并附完整选择/淘汰清单

            下载：[arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip](https://github.com/wangsen19900105/tts/releases/download/arasaac-classified-preview-2026-10-09/arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip)

            SHA-256：`5684591cc3774d8353654dd0619f3232bd9be256d20c4b7c1ee5b56841a0255f`

            许可提醒：ARASAAC 原图为 CC BY-NC-SA，本包仅供非商业审核和自制素材规划，不可直接作为 CardChat 商业素材使用。
        run: |
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body "$ISSUE_BODY"
