name: Publish ARASAAC macOS-compatible preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-arasaac-classified-preview.yml

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify the existing filtered archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip
          SOURCE_SHA256: 5684591cc3774d8353654dd0619f3232bd9be256d20c4b7c1ee5b56841a0255f
        run: |
          gh release download "arasaac-classified-preview-2026-10-09" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$SOURCE_NAME" \
            --dir .
          echo "$SOURCE_SHA256  $SOURCE_NAME" | sha256sum --check

      - name: Repackage as a plain macOS-compatible ZIP
        env:
          SOURCE_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-v2.zip
          OUTPUT_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-macos.zip
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          source_name = os.environ["SOURCE_NAME"]
          output_name = os.environ["OUTPUT_NAME"]

          with zipfile.ZipFile(source_name, "r") as source_archive:
              source_entries = source_archive.infolist()
              with zipfile.ZipFile(
                  output_name,
                  "w",
                  compression=zipfile.ZIP_DEFLATED,
                  compresslevel=6,
                  allowZip64=True,
              ) as output_archive:
                  for source_entry in source_entries:
                      output_entry = zipfile.ZipInfo(
                          source_entry.filename,
                          date_time=(2026, 10, 10, 0, 0, 0),
                      )
                      output_entry.compress_type = zipfile.ZIP_DEFLATED
                      output_entry.create_system = 3
                      if source_entry.is_dir():
                          output_entry.external_attr = (0o40755 << 16) | 0x10
                          data = b""
                      else:
                          output_entry.external_attr = 0o100644 << 16
                          data = source_archive.read(source_entry)
                      output_archive.writestr(output_entry, data)

          with zipfile.ZipFile(output_name, "r") as output_archive:
              first_error = output_archive.testzip()
              if first_error is not None:
                  raise RuntimeError(f"CRC check failed for {first_error}")
              if output_archive.namelist() != [entry.filename for entry in source_entries]:
                  raise RuntimeError("Archive entry list changed during repackaging")
          PY

          unzip -tq "$OUTPUT_NAME"
          test "$(stat -c %s "$OUTPUT_NAME")" -gt 40000000
          sha256sum "$OUTPUT_NAME" | tee macos-archive.sha256

      - name: Upload the macOS-compatible archive
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-macos.zip
        run: |
          gh release upload "arasaac-classified-preview-2026-10-09" "$OUTPUT_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Post macOS download instructions to issue 1
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT_NAME: arasaac-one-per-term-colored-flat-128px-2026-10-10-macos.zip
        run: |
          ARCHIVE_SHA256="$(cut -d ' ' -f 1 macos-archive.sha256)"
          ARCHIVE_SIZE="$(stat -c %s "$OUTPUT_NAME")"
          ARCHIVE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/arasaac-classified-preview-2026-10-09/$OUTPUT_NAME"

          cat > issue-body.md <<EOF
          已重新打包为 **macOS“归档实用工具”兼容版**，移除了旧 ZIP 中的 Java/JAR 元数据：

          下载：[$OUTPUT_NAME]($ARCHIVE_URL)

          - 文件大小：**$ARCHIVE_SIZE 字节**（约 39 MiB）
          - SHA-256：\`$ARCHIVE_SHA256\`
          - 内容不变：7,369 张 JPG，并保留选择、淘汰和人工复核清单

          **仓库现在是私有仓库。请先在浏览器中登录有权限的 GitHub 账号，再打开上面的链接。** 未登录时 GitHub 会返回只有 9 字节、内容为 \`Not Found\` 的同名文件；这个文件当然无法解压。下载后也可以先确认文件约为 39 MiB。

          许可提醒：ARASAAC 原图为 CC BY-NC-SA，本包仅供非商业审核和自制素材规划，不可直接作为 CardChat 商业素材使用。
          EOF

          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file issue-body.md

      - name: Mark the upload as complete
        env:
          GH_TOKEN: ${{ github.token }}
          SUCCESS_TAG: arasaac-macos-upload-success-2026-10-10
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SUCCESS_TAG" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$SUCCESS_TAG" \
              -f sha="$GITHUB_SHA" \
              -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$SUCCESS_TAG" \
              -f sha="$GITHUB_SHA"
          fi
