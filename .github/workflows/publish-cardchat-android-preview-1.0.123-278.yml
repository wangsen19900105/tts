name: Publish CardChat Android preview 1.0.123 (278)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-cardchat-android-preview-1.0.123-278.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and verify APK
        env:
          APK_URL: https://temp.sh/tJBHe/cardchat-android-preview-1.0.123-278-arm64-v8a.apk
          APK_SHA256: b737b08355eda4aa66c38ac81494737254731ef4bdc9da46d0297616ee253295
          APK_SIZE: "445949159"
          APK_NAME: CardChat-1.0.123-278-mediapipe-direction-preview-arm64.apk
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors --max-time 2400 --request POST "$APK_URL" --output "$APK_NAME"
          test "$(stat -c%s "$APK_NAME")" = "$APK_SIZE"
          echo "$APK_SHA256  $APK_NAME" | sha256sum --check

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: CardChat-1.0.123-278-mediapipe-direction-preview-arm64.apk
          RELEASE_TAG: cardchat-android-preview-1.0.123-278
          RELEASE_NOTES: |
            Android MediaPipe 眼控方向真机验证包。

            - 版本：1.0.123 (278)
            - 包名：com.cardchat.app
            - ABI：仅 arm64-v8a
            - 渠道：preview / cn
            - 文件大小：445,949,159 bytes（425.29 MiB）
            - APK SHA-256：b737b08355eda4aa66c38ac81494737254731ef4bdc9da46d0297616ee253295
            - 签名证书 SHA-256：4fcc595c5747b69bcd5156df62c6e976384f344ac5b0aca4f638b8565aca3294

            本包把 MediaPipe 的虹膜相对位移与头部 yaw/pitch 融合为同一个校准信号，修正转头时准星看起来上下、左右反向的问题。旧 MediaPipe 校准会自动失效；安装后必须重新完成 9 点校准。

            本地已通过方向算法测试、TypeScript 检查、APK v2 签名校验、ZIP 完整性、包名/版本号、单 ABI 及内置模型哈希校验。该包仍需 Android 真机验证；本次未修改 iPhone TrueDepth 射线算法。

            这是开发测试包，不是应用商店正式发布版本。本次源码仍保留在本地工作区，未推送到 CardChat 远程仓库。
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$APK_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CardChat Android Preview 1.0.123 (278) — 眼控方向验证包" \
            --notes "$RELEASE_NOTES" \
            --prerelease
