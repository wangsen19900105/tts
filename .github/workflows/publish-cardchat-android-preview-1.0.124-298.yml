name: Publish CardChat Android preview 1.0.124 (298)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-cardchat-android-preview-1.0.124-298.yml"

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download, reassemble, and verify APK
        env:
          APK_NAME: CardChat-1.0.124-298-eye-control-layout-preview-arm64.apk
          APK_SIZE: "446767669"
          APK_SHA256: 6ebb3752449888cba2ad37e3ec33389c0381e755edda94f50d0e873b10a6e633
        shell: bash
        run: |
          set -euo pipefail
          part_sources=(
            "GET https://litter.catbox.moe/f58v9z"
            "GET https://litter.catbox.moe/g2n4qp"
            "GET https://litter.catbox.moe/qhbh9p"
            "GET https://litter.catbox.moe/qm7mon"
            "GET https://litter.catbox.moe/yl7xdf"
            "GET https://litter.catbox.moe/2tep3a"
            "GET https://litter.catbox.moe/mko01q"
            "GET https://litter.catbox.moe/rozexl"
            "GET https://litter.catbox.moe/wwlk76"
            "GET https://litter.catbox.moe/m31ifs"
            "GET https://litter.catbox.moe/leb8ch"
            "POST https://temp.sh/HiSOz/part-al"
            "POST https://temp.sh/HAXRy/part-am"
            "POST https://temp.sh/vlzyq/part-an"
            "POST https://temp.sh/OiNan/part-ao"
            "POST https://temp.sh/UzDwp/part-ap"
            "POST https://temp.sh/RUWUw/part-aq"
            "POST https://temp.sh/ZCsPF/part-ar"
            "POST https://temp.sh/STEyZ/part-as"
            "POST https://temp.sh/xfiNX/part-at"
            "POST https://temp.sh/yGnBg/part-au"
            "POST https://temp.sh/uXJXm/part-av"
          )
          for part_index in "${!part_sources[@]}"; do
            part_method="${part_sources[$part_index]%% *}"
            part_url="${part_sources[$part_index]#* }"
            printf -v part_name 'part-%02d' "$part_index"
            curl --fail --silent --show-error --location --http1.1 --retry 8 --retry-all-errors --connect-timeout 30 --max-time 600 --request "$part_method" "$part_url" --output "$part_name"
            expected_part_size=20971520
            if [ "$part_index" -eq 21 ]; then expected_part_size=6365749; fi
            test "$(stat -c%s "$part_name")" = "$expected_part_size"
          done
          cat part-* > "$APK_NAME"
          test "$(stat -c%s "$APK_NAME")" = "$APK_SIZE"
          echo "$APK_SHA256  $APK_NAME" | sha256sum --check

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: CardChat-1.0.124-298-eye-control-layout-preview-arm64.apk
          RELEASE_TAG: cardchat-android-preview-1.0.124-298
          RELEASE_TITLE: CardChat Android Preview 1.0.124 (298) — 眼控界面布局配置测试包
          RELEASE_NOTES: |
            Android 眼控界面布局真机验证包。

            - 版本：1.0.124 (298)
            - 包名：com.cardchat.app
            - ABI：仅 arm64-v8a
            - 渠道：preview / cn
            - 文件大小：446,767,669 bytes（426.07 MiB）
            - APK SHA-256：6ebb3752449888cba2ad37e3ec33389c0381e755edda94f50d0e873b10a6e633

            本包新增可调节的工具栏高度和按钮间距，并保留原有播放按钮组位置配置；启用眼控时会按手机和平板分别应用对应布局，用户仍可在界面设置中继续微调。左侧配置类按钮保持比右侧主要操作按钮小一号。

            新增卡片宽高比例配置（1:0.5 到 1:2.0，步长 0.1）：卡片宽度不变，只调整高度，卡片图片保持原始宽高比；卡片文字最多显示两行并在超出时省略。网格横向可见间距统一为 4 px，不再因眼控模式额外放大。

            关闭眼控时会主动隐藏底部控制按钮；每次重新启用眼控都会自动显示。源码已本地提交 aa32158a，尚未推送 CardChat 远程仓库。

            本地已通过 TypeScript、眼控算法、扫描控制、i18n、APK v2 签名和 ZIP 完整性校验，并用手机网页视口核对 1:1、1:0.7、1:1.5 三组卡片效果。

            这是开发测试包，不是应用商店正式发布版本；实际布局与眼控手感以 Android 手机/平板真机验收为准。
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --prerelease

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: CardChat-1.0.124-298-eye-control-layout-preview-arm64.apk
          APK_SIZE: "446767669"
          APK_SHA256: 6ebb3752449888cba2ad37e3ec33389c0381e755edda94f50d0e873b10a6e633
          RELEASE_TAG: cardchat-android-preview-1.0.124-298
        shell: bash
        run: |
          set -euo pipefail
          remote_size=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$APK_NAME\") | .size")
          remote_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$APK_NAME\") | .digest")
          test "$remote_size" = "$APK_SIZE"
          test "$remote_digest" = "sha256:$APK_SHA256"

      - name: Create a new test issue
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: CardChat-1.0.124-298-eye-control-layout-preview-arm64.apk
          RELEASE_TAG: cardchat-android-preview-1.0.124-298
          ISSUE_TITLE: CardChat Android Preview 测试包（眼控界面布局配置，1.0.124 / build 298）
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
          action_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > issue-body.md <<EOF
          ## 下载

          - [直接下载 APK（426.07 MiB）]($apk_url)
          - [查看 GitHub Prerelease 说明]($release_url)
          - [查看 GitHub Actions 发布校验]($action_url)

          ## 本版调整

          - 在“界面”设置中新增“工具栏高度”，并把“发音栏高度”移到工具栏配置后；原有“按钮间距”和“播放按钮组”配置继续使用。
          - 启用眼控时按手机、平板分别自动应用对应的工具栏高度和间距，用户仍可继续手动微调。
          - 左侧配置、锁、账号中心、素材库、重新校准等按钮保持比右侧主要操作按钮小一号。
          - 新增“卡片宽高比例”，支持 1:0.5–1:2.0、步长 0.1；卡片宽度不变，只改变高度，图片保持原始宽高比例。
          - 卡片文字最多显示两行，超出时省略；卡片横向可见间距统一为 4 px，与普通模式一致。
          - 关闭眼控时主动隐藏底部控制按钮；每次重新启用眼控都会自动显示。

          ## 建议重点验证

          1. 分别在 Android 手机和平板上启用眼控，确认顶部左右按钮尺寸、间距和工具栏高度合适。
          2. 在“界面”设置里调节工具栏高度与按钮间距，确认修改立即生效且可以恢复。
          3. 分别查看 1:0.5、1:0.7、1:1、1:1.5、1:2 的卡片布局，确认宽度不变、只有高度改变。
          4. 检查不同宽高比例下图片不拉伸、文字最多两行、横向卡片间距仍清晰可见。
          5. 关闭再启用眼控，确认底部按钮先隐藏、再自动显示。

          ## 包信息

          - 版本：1.0.124
          - 构建号：298
          - 包名：\`com.cardchat.app\`
          - ABI：仅 \`arm64-v8a\`
          - 渠道：preview / cn
          - 文件大小：446,767,669 bytes（426.07 MiB）
          - 源码提交：\`aa32158a0e56da5eb26f4acb604b02d5f7adb6bd\`
          - 源码状态：已在本地提交，尚未推送 CardChat 远程仓库

          ## 校验

          - APK SHA-256：\`6ebb3752449888cba2ad37e3ec33389c0381e755edda94f50d0e873b10a6e633\`
          - 已验证：TypeScript、眼控算法、扫描控制、i18n、APK v2 签名、ZIP 完整性。
          - GitHub Actions 发布前重新核验了精确字节数与 SHA-256；Release 创建后再次核对资产大小和 digest，结果一致。

          这是一个全新的测试 Issue，历史包和旧对话均未覆盖。

          > 这是开发测试包，不是应用商店正式发布版本；最终布局与眼控手感以 Android 手机/平板真机验收为准。
          EOF
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file issue-body.md)
          printf 'Issue: %s\n' "$issue_url" >> "$GITHUB_STEP_SUMMARY"
