name: Publish CardChat Android preview 1.0.124 (302)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-cardchat-android-preview-1.0.124-302.yml"

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download, reassemble, and verify APK
        env:
          APK_NAME: CardChat-1.0.124-302-ui-accessibility-preview-arm64.apk
          APK_SIZE: "446964073"
          APK_SHA256: 7cc386147e73a37f64a3d560a8c0b6daf9b2c5704a1f3cc51fb8cdada106d887
        shell: bash
        run: |
          set -euo pipefail
          part_sources=(
            "GET https://litter.catbox.moe/buoptb"
            "GET https://litter.catbox.moe/ygxd65"
            "GET https://litter.catbox.moe/qzpyxb"
            "GET https://litter.catbox.moe/d7av69"
            "GET https://litter.catbox.moe/miyb4r"
            "GET https://litter.catbox.moe/m1n4ug"
            "GET https://litter.catbox.moe/47lomg"
            "GET https://litter.catbox.moe/o9a3bf"
            "GET https://litter.catbox.moe/t7pl9n"
            "GET https://litter.catbox.moe/ybmfwy"
            "GET https://litter.catbox.moe/v2lbpk"
            "GET https://litter.catbox.moe/o7ak7n"
            "GET https://litter.catbox.moe/tx4my1"
            "GET https://litter.catbox.moe/zduyuq"
            "GET https://litter.catbox.moe/7uoqho"
            "GET https://litter.catbox.moe/6qyza6"
            "GET https://litter.catbox.moe/yzveik"
            "GET https://litter.catbox.moe/wivrzr"
            "GET https://litter.catbox.moe/ymgyu5"
            "GET https://litter.catbox.moe/pgprpu"
            "GET https://litter.catbox.moe/09k1gf"
            "GET https://litter.catbox.moe/ylp3a6"
          )
          for part_index in "${!part_sources[@]}"; do
            part_method="${part_sources[$part_index]%% *}"
            part_url="${part_sources[$part_index]#* }"
            printf -v part_name 'part-%02d' "$part_index"
            curl --fail --silent --show-error --location --http1.1 --retry 8 --retry-all-errors --connect-timeout 30 --max-time 600 --request "$part_method" "$part_url" --output "$part_name"
            expected_part_size=20971520
            if [ "$part_index" -eq 21 ]; then expected_part_size=6562153; fi
            test "$(stat -c%s "$part_name")" = "$expected_part_size"
          done
          cat part-* > "$APK_NAME"
          test "$(stat -c%s "$APK_NAME")" = "$APK_SIZE"
          echo "$APK_SHA256  $APK_NAME" | sha256sum --check

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: CardChat-1.0.124-302-ui-accessibility-preview-arm64.apk
          RELEASE_TAG: cardchat-android-preview-1.0.124-302
          RELEASE_TITLE: CardChat Android Preview 1.0.124 (302) — 界面与辅助操作优化测试包
          RELEASE_NOTES: |
            Android 界面、眼控与扫描辅助操作综合真机验证包。

            - 版本：1.0.124 (302)
            - 包名：com.cardchat.app
            - ABI：仅 arm64-v8a
            - 渠道：preview / cn
            - 文件大小：446,964,073 bytes（426.26 MiB）
            - APK SHA-256：7cc386147e73a37f64a3d560a8c0b6daf9b2c5704a1f3cc51fb8cdada106d887

            本包完善眼控与扫描控制，优化校准、眨眼确认和单眼后退流程，并修复 Android 打开扫描控制时的 Provider 报错。

            界面设置重新整理了顶部工具栏、卡片宽高、卡片列数、分享与按压反馈；统一顶部按钮尺寸和图标裁切，完善窄屏弹窗与横向选项布局。相关新增文案已覆盖 58 种界面语言。

            源码已提交并推送到 CardChat 分支 codex/mediapipe-eye-control，提交 a7d3c471a5c1301f4b16bd84d7d93aec1e958b83。

            本地已通过 TypeScript、相关单元测试、58 种界面语言校验、Web 构建、APK v2 签名、ABI 与 ZIP 完整性校验。

            这是开发测试包，不是应用商店正式发布版本；最终交互与眼控手感以 Android 手机/平板真机验收为准。
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --prerelease

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: CardChat-1.0.124-302-ui-accessibility-preview-arm64.apk
          APK_SIZE: "446964073"
          APK_SHA256: 7cc386147e73a37f64a3d560a8c0b6daf9b2c5704a1f3cc51fb8cdada106d887
          RELEASE_TAG: cardchat-android-preview-1.0.124-302
        shell: bash
        run: |
          set -euo pipefail
          remote_size=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$APK_NAME\") | .size")
          remote_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$APK_NAME\") | .digest")
          test "$remote_size" = "$APK_SIZE"
          test "$remote_digest" = "sha256:$APK_SHA256"

      - name: Create a new test issue
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: CardChat-1.0.124-302-ui-accessibility-preview-arm64.apk
          RELEASE_TAG: cardchat-android-preview-1.0.124-302
          ISSUE_TITLE: CardChat Android Preview 测试包（界面与辅助操作优化，1.0.124 / build 302）
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
          action_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > issue-body.md <<EOF
          ## 下载

          - [直接下载 APK（426.26 MiB）]($apk_url)
          - [查看 GitHub Prerelease 说明]($release_url)
          - [查看 GitHub Actions 发布校验]($action_url)

          ## 本版调整

          - 完善眼控校准、视线有效范围和眨眼确认流程；校准精度不足时允许继续使用并提示后续可重校准。
          - 单眼闭合达到 0.5 秒立即后退一级，不再等待重新睁眼；扫描时跳过隐藏占位内容。
          - 修复 Android 打开扫描控制时报 useEyeControl must be used inside EyeControlProvider。
          - 重整扫描控制设置，完善按钮数量、外接按钮、拍打屏幕、眨眼确认及自动扫描相关交互。
          - 顶部工具栏默认高度、按钮间距、图标尺寸和上下对齐统一；修复日历、垃圾桶等图标裁切。
          - 界面设置拆分卡片宽高与卡片列数，并优化工具栏、分享、打印版面和按压反馈设置的紧凑布局。
          - 按压反馈支持震动与高亮多选或全不选；分享设置并入顶部工具栏弹窗。
          - 新增及调整的界面文案已覆盖全部 58 种 UI 语言。

          ## 建议重点验证

          1. 在 Android 手机和平板上打开扫描控制，确认不再出现 EyeControlProvider 报错。
          2. 分别验证外接按钮、拍打屏幕、眨眼确认和自动扫描；隐藏占位项应不可选。
          3. 单眼持续闭合 0.5 秒时，应当立即后退且每次闭眼只触发一次。
          4. 验证眼控校准、转头或视线离开屏幕时的眨眼过滤，以及横竖屏切换后的状态。
          5. 调节顶部工具栏高度、按钮间距、卡片宽高和卡片列数，确认窄屏布局不溢出。
          6. 检查日历、搜索、键盘、分享、返回、垃圾桶和发声图标尺寸、底部裁切与对齐。
          7. 验证分享、打印版面、按压反馈及各语言下设置文案与布局。

          ## 包信息

          - 版本：1.0.124
          - 构建号：302
          - 包名：com.cardchat.app
          - ABI：仅 arm64-v8a
          - 渠道：preview / cn
          - 文件大小：446,964,073 bytes（426.26 MiB）
          - 源码分支：codex/mediapipe-eye-control
          - 源码提交：a7d3c471a5c1301f4b16bd84d7d93aec1e958b83
          - 源码状态：已提交并推送至 CardChat 远程仓库

          ## 校验

          - APK SHA-256：7cc386147e73a37f64a3d560a8c0b6daf9b2c5704a1f3cc51fb8cdada106d887
          - 签名证书 SHA-256：4fcc595c5747b69bcd5156df62c6e976384f344ac5b0aca4f638b8565aca3294
          - 已验证：TypeScript、相关单元测试、58 种 UI 语言、Web 构建、APK v2 签名、ABI 与 ZIP 完整性。
          - GitHub Actions 发布前重新核验精确字节数与 SHA-256；Release 创建后再次核对资产大小和 digest。

          这是一个全新的测试 Issue，历史包和旧对话均未覆盖。

          > 这是开发测试包，不是应用商店正式发布版本；最终交互与眼控手感以 Android 手机/平板真机验收为准。
          EOF
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file issue-body.md)
          printf 'Issue: %s\n' "$issue_url" >> "$GITHUB_STEP_SUMMARY"
