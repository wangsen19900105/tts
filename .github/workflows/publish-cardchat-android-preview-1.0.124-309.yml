name: Publish CardChat Android preview 1.0.124 (309)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-cardchat-android-preview-1.0.124-309.yml"

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download, reassemble, and verify APK
        env:
          APK_NAME: cardchat-1.0.124-309-preview-arm64.apk
          APK_SIZE: "447038233"
          APK_SHA256: 92018b16491fd52678bdb14193756e2da164ce52909e702b205b228595106746
        shell: bash
        run: |
          set -euo pipefail
          part_sources=(
            "POST https://temp.sh/PhALW/part-aa"
            "POST https://temp.sh/nwtvM/part-ab"
            "POST https://temp.sh/YEree/part-ac"
            "POST https://temp.sh/KBpZH/part-ad"
            "POST https://temp.sh/GuIfH/part-ae"
            "POST https://temp.sh/xTPhw/part-af"
            "POST https://temp.sh/LHCdt/part-ag"
            "POST https://temp.sh/rTttZ/part-ah"
            "POST https://temp.sh/whoHk/part-ai"
            "POST https://temp.sh/PfbxP/part-aj"
            "POST https://temp.sh/UBtOm/part-ak"
            "POST https://temp.sh/fpwtd/part-al"
            "POST https://temp.sh/CRBfp/part-am"
            "POST https://temp.sh/fkfcW/part-an"
            "POST https://temp.sh/yZsTv/part-ao"
            "POST https://temp.sh/vwrOc/part-ap"
            "POST https://temp.sh/vIMwE/part-aq"
            "POST https://temp.sh/BPXXp/part-ar"
            "POST https://temp.sh/HMLAV/part-as"
            "POST https://temp.sh/Dixli/part-at"
            "POST https://temp.sh/njwTV/part-au"
            "POST https://temp.sh/zwyyB/part-av"
          )
          for part_index in "${!part_sources[@]}"; do
            part_method="${part_sources[$part_index]%% *}"
            part_url="${part_sources[$part_index]#* }"
            printf -v part_name 'part-%02d' "$part_index"
            curl --fail --silent --show-error --location --http1.1 --retry 8 --retry-all-errors --connect-timeout 30 --max-time 900 --request "$part_method" "$part_url" --output "$part_name"
            expected_part_size=20971520
            if [ "$part_index" -eq 21 ]; then expected_part_size=6636313; fi
            test "$(stat -c%s "$part_name")" = "$expected_part_size"
          done
          cat part-* > "$APK_NAME"
          test "$(stat -c%s "$APK_NAME")" = "$APK_SIZE"
          echo "$APK_SHA256  $APK_NAME" | sha256sum --check

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: cardchat-1.0.124-309-preview-arm64.apk
          RELEASE_TAG: cardchat-android-preview-1.0.124-309
          RELEASE_TITLE: CardChat Android Preview 1.0.124 (309) — 深色主题与辅助操作测试包
          RELEASE_NOTES: |
            Android 深色主题、卡片配色、眼控和扫描辅助操作综合真机验证包。

            - 版本：1.0.124 (309)
            - 包名：com.cardchat.app
            - ABI：仅 arm64-v8a
            - 渠道：preview / cn
            - 文件大小：447,038,233 bytes（426.33 MiB）
            - APK SHA-256：92018b16491fd52678bdb14193756e2da164ce52909e702b205b228595106746

            本包加入卡片背景色、字体颜色与深色主题，完善手机和平板默认布局、卡片列数和设置弹窗；同时改进眼控距离与姿态适配、眨眼确认、外接按钮扫描、防抖和连续按压响应。

            源码已提交并推送到 CardChat 分支 codex/mediapipe-eye-control；构建源码提交为 31df75c2b016b093c84f794683f42bdc886e4ad9，APK 归档提交为 732cd37b6bafb2ad4d0fef040d0eb2331b1c7a65。

            已验证 TypeScript、相关单元测试、58 种界面语言、Web 构建、APK v2 签名、arm64 ABI、ZIP 完整性及精确 SHA-256。

            这是开发测试包，不是应用商店正式发布版本；最终交互与眼控手感以 Android 手机/平板真机验收为准。
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES" --prerelease

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: cardchat-1.0.124-309-preview-arm64.apk
          APK_SIZE: "447038233"
          APK_SHA256: 92018b16491fd52678bdb14193756e2da164ce52909e702b205b228595106746
          RELEASE_TAG: cardchat-android-preview-1.0.124-309
        shell: bash
        run: |
          set -euo pipefail
          remote_size=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$APK_NAME\") | .size")
          remote_digest=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq ".assets[] | select(.name == \"$APK_NAME\") | .digest")
          test "$remote_size" = "$APK_SIZE"
          test "$remote_digest" = "sha256:$APK_SHA256"

      - name: Create a new test issue
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: cardchat-1.0.124-309-preview-arm64.apk
          RELEASE_TAG: cardchat-android-preview-1.0.124-309
          ISSUE_TITLE: CardChat Android Preview 测试包（深色主题与辅助操作，1.0.124 / build 309）
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          apk_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$APK_NAME"
          action_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > issue-body.md <<EOF
          ## 下载

          - [直接下载 APK（426.33 MiB）]($apk_url)
          - [查看 GitHub Prerelease 说明]($release_url)
          - [查看 GitHub Actions 发布校验]($action_url)

          ## 本版调整

          - 新增卡片背景色和深色主题，并统一顶部栏、侧边栏、选中态、分隔线与卡片网格的深色配色。
          - 句子栏、分类和卡片支持字体颜色设置；颜色标签复用统一调色盘并修复触摸事件复用报错。
          - 优化手机与平板默认工具栏、句子栏尺寸和按钮间距；卡片列数上限固定为手机 15、平板 30。
          - 完善卡片/分类样式弹窗、顶部工具栏、分享、打印版面及按压反馈的紧凑布局。
          - 扫描模式支持“外接按钮 + 眨眼”双按钮方案，完善连续按压、防抖、长按后退和 0.5 秒眨眼确认。
          - 改进眼控在更远距离、头部偏转和横竖屏方向下的稳定性与校准映射。
          - 内置标点卡片单独点击不发音；补齐乘除发音、卡片名称空格及版本信息异常恢复。
          - 新增及调整的界面文案已覆盖全部 58 种 UI 语言。

          ## 建议重点验证

          1. 在 Android 手机和平板上切换深色主题，检查顶部栏、侧边栏、卡片网格、选中态和自定义颜色。
          2. 分别调整句子栏、分类和卡片字体颜色，确认调色盘选择、关闭重开和导入导出后保持正常。
          3. 验证手机最多 15 列、平板最多 30 列，以及平板默认工具栏和句子栏尺寸。
          4. 验证外接按钮、眨眼确认、连续快速按压、防抖及长按后退；未开启防抖时应逐次立即切换。
          5. 在不同距离和头部偏转状态下验证眨眼与眼控，并检查横竖屏切换后的校准和定位。
          6. 检查加减乘除发音、标点卡片静音、卡片名称空格及版本信息请求异常时的提示。

          ## 包信息

          - 版本：1.0.124
          - 构建号：309
          - 包名：com.cardchat.app
          - ABI：仅 arm64-v8a
          - 渠道：preview / cn
          - 文件大小：447,038,233 bytes（426.33 MiB）
          - 源码分支：codex/mediapipe-eye-control
          - 构建源码提交：31df75c2b016b093c84f794683f42bdc886e4ad9
          - APK 归档提交：732cd37b6bafb2ad4d0fef040d0eb2331b1c7a65
          - 源码状态：已提交并推送至 CardChat 远程仓库

          ## 校验

          - APK SHA-256：92018b16491fd52678bdb14193756e2da164ce52909e702b205b228595106746
          - 签名证书 SHA-256：4fcc595c5747b69bcd5156df62c6e976384f344ac5b0aca4f638b8565aca3294
          - 已验证：TypeScript、相关单元测试、58 种 UI 语言、Web 构建、APK v2 签名、arm64 ABI 与 ZIP 完整性。
          - GitHub Actions 发布前重新核验精确字节数与 SHA-256；Release 创建后再次核对资产大小和 digest。

          这是一个全新的测试 Issue，历史包和旧对话均未覆盖。

          > 这是开发测试包，不是应用商店正式发布版本；最终交互与眼控手感以 Android 手机/平板真机验收为准。
          EOF
          issue_url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file issue-body.md)
          printf 'Issue: %s\n' "$issue_url" >> "$GITHUB_STEP_SUMMARY"
